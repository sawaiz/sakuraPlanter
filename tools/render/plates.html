<canvas id="c"></canvas><script src="../../pipeline/work/render/plates_data.js"></script>
<script type="module">
// Prusa CORE One bed (250 x 220 mm printable) with one plate's parts; ?i=<index>
import * as THREE from 'three';

Object.assign(sun.shadow.camera, { left: -250, right: 250, top: 300, bottom: -250, near: 50, far: 1500 }); sun.shadow.bias = -0.0005; S.add(sun);
